  branches: # Pipelines that run automatically on a commit to a branch can also be triggered manually
    develop:
      - step:
          image: squidfunk/mkdocs-material
          caches:
            - pip
          script: 
            - pip install mkdocs-with-pdf
            - python -m mkdocs build
          artifacts:
            - site/**
      - step:
          name: manifest push
          deployment: test
          image: dotsunited/git-ftp
          script:
            #- git ftp init --syncroot $BITBUCKET_CLONE_DIR/Plugins/ --user $ftp_user --passwd $ftp_pw $ftp_host
            - git ftp push --force --syncroot $BITBUCKET_CLONE_DIR/site/ --user $ftp_user --passwd $ftp_pw $ftp_host
    master:
      - step:
          image: squidfunk/mkdocs-material
          caches:
            - pip
          script: 
            - pip install mkdocs-with-pdf
            - python -m mkdocs build
          artifacts:
            - site/**
      - step:
          name: manifest push
          deployment: production
          image: dotsunited/git-ftp
          script:
            #- git ftp init --syncroot $BITBUCKET_CLONE_DIR/Plugins/ --user $ftp_user --passwd $ftp_pw $ftp_host
            - git ftp push --force --syncroot $BITBUCKET_CLONE_DIR/site/ --user $ftp_user --passwd $ftp_pw $ftp_host

          
