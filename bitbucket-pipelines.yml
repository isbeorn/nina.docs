  branches: # Pipelines that run automatically on a commit to a branch can also be triggered manually
    develop:
      - step:
          deployment: test
          caches:
            - pip
          script:
            - apt-get update
            - apt-get -qq install git-ftp
            - pip install mkdocs
            - pip install mkdocs-material
            - python -m mkdocs build -v
            - git ftp push --force --syncroot $BITBUCKET_CLONE_DIR/site/ --user $ftp_user --passwd $ftp_pw $ftp_host
    master:
      - step:
          deployment: production
          caches:
            - pip
          script: 
            - apt-get update
            - apt-get -qq install git-ftp
            - pip install mkdocs
            - pip install mkdocs-material
            - python -m mkdocs build
            - git ftp push --force --syncroot $BITBUCKET_CLONE_DIR/site/ --user $ftp_user --passwd $ftp_pw $ftp_host
          
